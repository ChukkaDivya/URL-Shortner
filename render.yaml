services:
  - type: web
    name: swiftlink
    env: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: swiftlink-db
          property: connectionString

databases:
  - name: swiftlink-db
    databaseName: swiftlink
    user: swiftlink_user
