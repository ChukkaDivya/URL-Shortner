<!DOCTYPE html>
<html>
<head>
<style>
    body{
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    form{
        background:white;
        padding:25px;
        border-radius:6px;
        box-shadow:0 2px 6px rgba(0,0,0,0.1);
        text-align:center;
    }

    h2{
        margin-bottom:15px;
    }

    input[type="password"], input[type="text"]{
        padding:8px;
        width:200px;
        margin-bottom:10px;
        border:1px solid #ccc;
        border-radius:4px;
    }

    .show{
        font-size:14px;
        margin-bottom:10px;
        display:block;
    }

    button{
        padding:8px 15px;
        border:none;
        background:#4CAF50;
        color:white;
        border-radius:4px;
        cursor:pointer;
    }

    button:hover{
        background:#45a049;
    }
</style>
</head>

<body>

<form method="POST">
    <h2>Password Required</h2>

    <input type="password" id="password" name="password" placeholder="Enter password">

    <label class="show">
        <input type="checkbox" onclick="togglePassword()"> Show Password
    </label>

    <button type="submit">Submit</button>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
</form>

</body>
</html>

<script>
function togglePassword(){
    const pwd = document.getElementById("password");
    if(pwd.type === "password"){
        pwd.type = "text";
    } else {
        pwd.type = "password";
    }
}
</script>
