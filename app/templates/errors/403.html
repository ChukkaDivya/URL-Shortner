{% extends "base.html" %}

{% block title %}Access Forbidden - SwiftLink{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="text-align: center;">
        <h1 style="font-size: 64px; margin: 0; color: #e53e3e;">403</h1>
        <h2>Access Forbidden</h2>
        <p class="auth-subtitle">You do not have permission to access or perform actions on this resource.</p>

        <div style="margin-top: 25px;">
            <a href="{{ url_for('dashboard.dashboard') }}" class="btn-primary" style="display: inline-block; width: auto; padding: 10px 24px;">Go to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
