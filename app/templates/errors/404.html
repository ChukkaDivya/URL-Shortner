{% extends "base.html" %}

{% block title %}Page Not Found - SwiftLink{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="text-align: center;">
        <h1 style="font-size: 64px; margin: 0; color: #4f46e5;">404</h1>
        <h2>Page Not Found</h2>
        <p class="auth-subtitle">The short link or page you are looking for does not exist or has been removed.</p>

        <div style="margin-top: 25px;">
            <a href="{{ url_for('links.index') }}" class="btn-primary" style="display: inline-block; width: auto; padding: 10px 24px;">Return to Home</a>
        </div>
    </div>
</div>
{% endblock %}
