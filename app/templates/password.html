{% extends "base.html" %}

{% block title %}Password Protection - SwiftLink{% endblock %}

{% block content %}
<div class="auth-container">
    <form method="POST" class="password-form">
        <h2>Password Required</h2>
        <p class="hint" style="text-align: center;">This link is password protected. Enter the password to access it.</p>

        <div class="password-wrapper" style="margin-bottom: 15px;">
            <input type="password" id="password" name="password" placeholder="Enter password" required autofocus>
            <button type="button" class="toggle-password-btn" onclick="togglePassword('password', this)">Show</button>
        </div>

        <button type="submit" class="btn-primary">Access Link</button>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </form>
</div>
{% endblock %}
