{% extends "base.html" %}

{% block title %}Register - SwiftLink{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Sign up to save and track your shortened URLs</p>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ username or '' }}" placeholder="Choose a username" required autofocus>
                <p class="hint">3-30 characters (letters, numbers, _, -)</p>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
                    <button type="button" class="toggle-password-btn" onclick="togglePassword('password', this)">Show</button>
                </div>
            </div>

            <button type="submit" class="btn-primary">Register Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log in here</a>
        </p>
    </div>
</div>
{% endblock %}
