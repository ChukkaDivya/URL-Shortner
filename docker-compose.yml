version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=docker-dev-secret-key
      - DATABASE_URL=postgresql://swiftuser:swiftpass@db:5432/swiftdb
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=swiftuser
      - POSTGRES_PASSWORD=swiftpass
      - POSTGRES_DB=swiftdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
